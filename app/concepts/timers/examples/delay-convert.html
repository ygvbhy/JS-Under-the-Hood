<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
</head>
<body>
<script>
var max;
setTimeout(function () { console.log('2 ** 31'); }, 2 ** 31);
setTimeout(function () { console.log('-100'); }, -100);
setTimeout(function () { console.log('NaN'); }, NaN);
setTimeout(function () { console.log('Infinity'); }, Infinity);
setTimeout(function () { console.log('문자열 30'); }, '30');
setTimeout(function () { console.log('2 ** 32 + 30'); }, 2 ** 32 + 30);
setTimeout(function () {
  console.log('200ms 타이머');
  clearTimeout(max);
}, 200);
max = setTimeout(function () {
  console.log('2 ** 31 - 1 실행');
}, 2 ** 31 - 1);
</script>
</body>
</html>
