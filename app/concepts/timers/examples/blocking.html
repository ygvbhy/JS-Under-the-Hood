<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
</head>
<body>
<script>
var start = performance.now();
setTimeout(function () {
  console.log('타이머 실행, 50ms 이상 지남 ' + (performance.now() - start >= 50));
}, 10);
while (performance.now() - start < 50) {}
console.log('동기 코드 끝, 50ms 이상 지남 ' + (performance.now() - start >= 50));
</script>
</body>
</html>
