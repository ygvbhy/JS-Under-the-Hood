<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
#box { color: red; }
</style>
</head>
<body>
<p id="box" style="font-size:20px">글자</p>
<script>
const box = document.getElementById('box');
console.log(JSON.stringify(box.style.color), box.style.fontSize);
const computed = getComputedStyle(box);
console.log(computed.color, computed.fontSize);
</script>
</body>
</html>
