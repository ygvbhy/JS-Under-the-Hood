<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
</head>
<body>
<form id="form">
  <input id="nick" value="손님">
  <input id="agree" type="checkbox">
</form>
<script>
var form = document.getElementById('form');
var nick = document.getElementById('nick');
var agree = document.getElementById('agree');
nick.value = '철수';
agree.checked = true;
console.log(nick.value, agree.checked);
form.reset();
console.log(nick.value, agree.checked);
nick.setAttribute('value', '영희');
console.log(nick.value);
</script>
</body>
</html>
