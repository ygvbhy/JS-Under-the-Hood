<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
</head>
<body>
<div id="card">
<button id="save">저장</button>
<input type="checkbox" id="pin">
</div>
<script>
var card = document.getElementById('card');
var save = document.getElementById('save');
var pin = document.getElementById('pin');
var log = [];
card.addEventListener('click', function () { log.push('card 버블'); });
save.addEventListener('click', function (e) {
  log.push('save 1');
  e.stopPropagation();
});
save.addEventListener('click', function () { log.push('save 2'); });
save.click();
console.log(JSON.stringify(log));
function stopAtCard(e) {
  log.push('card 캡처');
  e.stopPropagation();
}
card.addEventListener('click', stopAtCard, true);
log = [];
save.click();
console.log(JSON.stringify(log));
card.removeEventListener('click', stopAtCard, true);
save.addEventListener('click', function (e) {
  log.push('save 캡처');
  e.stopPropagation();
}, true);
log = [];
save.click();
console.log(JSON.stringify(log));
pin.addEventListener('click', function (e) { e.stopPropagation(); });
log = [];
pin.click();
console.log(pin.checked + ' ' + JSON.stringify(log));
</script>
</body>
</html>
