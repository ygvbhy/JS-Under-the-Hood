<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
</head>
<body>
<input type="checkbox" id="a" onclick="return false">
<input type="checkbox" id="b">
<input type="checkbox" id="c">
<script>
var a = document.getElementById('a');
var b = document.getElementById('b');
var c = document.getElementById('c');
b.onclick = function () { return false; };
c.addEventListener('click', function () { return false; });
document.addEventListener('click', function (e) {
  console.log(e.target.id + ' ' + e.defaultPrevented);
});
a.click();
b.click();
c.click();
console.log(a.checked + ' ' + b.checked + ' ' + c.checked);
</script>
</body>
</html>
