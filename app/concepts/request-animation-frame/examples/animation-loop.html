<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"></head>
<body>
<script>
var start = null;
var frames = 0;
function step(t) {
  if (start === null) start = t;
  frames += 1;
  if (frames < 5) {
    requestAnimationFrame(step);
    return;
  }
  console.log(frames, t > start);
}
requestAnimationFrame(step);
</script>
</body>
</html>
