<script>
setTimeout(function () {
  console.log('타이머 0ms');
}, 0);
var count = 0;
function next() {
  count++;
  if (count < 1000) {
    queueMicrotask(next);
  } else {
    console.log('마이크로태스크 ' + count + '개 끝');
  }
}
queueMicrotask(next);
console.log('스크립트 끝');
</script>
