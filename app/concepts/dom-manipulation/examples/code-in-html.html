<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
</head>
<body>
<div id="box"></div>
<div id="plain"></div>
<script>
var box = document.getElementById('box');
var plain = document.getElementById('plain');

box.innerHTML = html;
console.log(box.children.length);
box.querySelector('button').click();
plain.textContent = html;
console.log(plain.children.length, plain.textContent === html);
</script>
</body>
</html>
